<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1238" />
    <meta name="description" content="Twist Monsters: a mobile-first HTML5 playable ad built with TypeScript, Three.js and WebGL." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Twist Monsters (WIP)</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='18' fill='%23000'/%3E%3Cg stroke='%23000' stroke-width='7' stroke-linecap='round' fill='none'%3E%3Cpath d='M32 14C28 8 34 4 36 2M50 32c6-4 10 2 12 4M32 50c4 6-2 10-4 12M14 32C8 28 4 34 2 36'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='9' fill='%23fff'/%3E%3Cellipse cx='32' cy='32' rx='2.4' ry='7' fill='%23000'/%3E%3C/svg%3E"
    />
    <style>
      /* Critical boot styles: painted before any JS runs, so there is never a blank screen. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1238;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(110% 70% at 50% 42%, #3c6fd8 0%, #18256e 55%, #070b24 100%);
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .boot__ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 6px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="frame"></div>
    <div id="boot"><div class="boot__ring"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
